# Mueller-Brown at beta=1.0: genuinely multi-basin (grid basin masses ~[0.80, 0.12, 0.08])
# with metastable barriers ~5 kT. Lower beta was chosen because beta>=2 makes the deepest
# basin carry ~all mass (the landscape becomes effectively unimodal and the free-energy /
# basin-recovery test is degenerate). This is a multi-basin free-energy RECOVERY / validation
# experiment: local unbiased baselines (MALA/HMC/PT) also sample it, so the claim is
# correctness/accuracy, not an efficiency win.
experiment_name: muller_brown_free_energy
target: muller_brown
target_cfg: {beta: 1.0, scale: 0.05, grid_n: 150}
jump_banks:
  - {kind: minima_complete_graph, intensity: 0.25}
  - {kind: random_matched_length_control, seed: 11, reference: {kind: minima_complete_graph, intensity: 0.25}}
run:
  n_particles: 512
  n_steps: 15000
  dt: 0.005
  record_every: 500
  iat_points: 3000
  seeds: [0, 1, 2]
  n_ref: 4000
reference:
  n_ref: 4000
  seed: 321
methods: [ULA, MALA, BAOAB, HMC, PT, LSBMC]
method_cfgs:
  MALA: {dt: 0.003}
  BAOAB: {dt: 0.005, friction: 2.0}
  HMC: {dt: 0.01, n_leapfrog: 5}
  PT: {dt: 0.003, n_temps: 4, beta_min_factor: 0.2, swap_interval: 5}
  LSBMC: {dt: 0.005, n_theta: 6, jump_chunk: 16}
