# Barrier-free-theorem sweep (Exp A) MFPT point: V=H(x^2-1)^2, H=0.75, eps=0.5.
# Metastable left-well start; coverage_time_all_basins = mean first left->right passage
# (MFPT), threshold_time_tv = mixing time. Local MFPT ~ exp(H/eps); LSC-CP flat. High-H
# local points are censored (coverage_fraction<1) -- read alongside the rate runs.
experiment_name: barrier_mfpt_H075_eps05
target: double_well_barrier
target_cfg: {H: 0.75, eps: 0.5}
jump_banks:
- {kind: double_well_shell, scale: 1.0, intensity: 1.0}
run:
  n_particles: 2048
  n_steps: 50000
  dt: 0.003
  record_every: 500
  iat_points: 2500
  seeds: [0, 1, 2]
  n_ref: 20000
reference: {n_ref: 20000, seed: 321}
methods: [ULA, RawCP, LSBMC]
method_cfgs:
  RawCP: {dt: 0.003, n_theta: 8, jump_chunk: 8, tame_cap: 5.0}
  LSBMC: {dt: 0.003, n_theta: 8, jump_chunk: 8, tame_cap: 5.0}
