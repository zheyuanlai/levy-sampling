experiment_name: four_well_smoke
target: four_well
target_cfg: {beta: 4.0}
jump_banks:
  - {kind: minima_edge_graph, intensity: 0.5, edges: [[0, 1], [0, 2], [1, 3], [2, 3]]}
  - {kind: random_matched_length_control, seed: 1, reference: {kind: minima_edge_graph, intensity: 0.5, edges: [[0, 1], [0, 2], [1, 3], [2, 3]]}}
run:
  n_particles: 64
  n_steps: 20
  dt: 0.01
  record_every: 5
  seeds: [0]
  n_ref: 256
reference:
  n_ref: 256
  seed: 123
methods: [ULA, MALA, LSBMC]
method_cfgs:
  MALA: {dt: 0.005}
  LSBMC: {dt: 0.01, n_theta: 4, jump_chunk: 8}
