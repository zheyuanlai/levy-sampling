experiment_name: triple_well_smoke
target: triple_well
target_cfg: {eps: 0.08}
jump_banks:
  - {kind: minima_edge_graph, edges: [[0, 1], [1, 2]], intensity: 1.0}   # adjacent
  - {kind: minima_edge_graph, edges: [[0, 2]], intensity: 1.0}           # overlong
run:
  n_particles: 64
  n_steps: 20
  dt: 0.002
  record_every: 5
  seeds: [0]
  n_ref: 256
reference:
  n_ref: 256
  seed: 123
methods: [ULA, RawCP, LSBMC]
method_cfgs:
  RawCP: {dt: 0.002, n_theta: 4, jump_chunk: 8}
  LSBMC: {dt: 0.002, n_theta: 4, jump_chunk: 8}
