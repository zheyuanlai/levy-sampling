experiment_name: muller10d_smoke
target: muller10d
target_cfg: {eps: 0.5, dim: 10, sigma_aux: 0.75, scale: 0.02, grid_n: 80}
jump_banks:
  - {kind: minima_complete_graph, intensity: 0.3}                        # lifted basin-to-basin shell
  - {kind: random_matched_length_control, seed: 11, reference: {kind: minima_complete_graph, intensity: 0.3}}
run:
  n_particles: 64
  n_steps: 20
  dt: 0.002
  record_every: 5
  seeds: [0]
  n_ref: 256
reference:
  n_ref: 256
  seed: 123
methods: [ULA, RawCP, LSBMC]
method_cfgs:
  RawCP: {dt: 0.002, n_theta: 4, jump_chunk: 8}
  LSBMC: {dt: 0.002, n_theta: 4, jump_chunk: 8}
