# Reproduction of the manuscript triple-well example: support design vs target bias.
# eps=0.08, Delta t=0.00035, T=4.2. Modes (-3,0,3). Adjacent support connects -3<->0<->3;
# overlong support connects -3<->3 (bypasses middle). Manuscript mode-TV to match:
# LSC-CP adjacent 0.035, LSC-CP overlong 0.007, raw overlong 0.301 (also middle-mass errors).
experiment_name: triple_well_support
target: triple_well
target_cfg: {eps: 0.08}
jump_banks:
  - {kind: minima_edge_graph, name: adjacent, edges: [[0, 1], [1, 2]], intensity: 1.0}
  - {kind: minima_edge_graph, name: overlong, edges: [[0, 2]], intensity: 1.0}
  - {kind: minima_edge_graph, name: short, edges: [[0, 1], [1, 2]], scale: 0.4, intensity: 1.0}  # too-short control
run:
  n_particles: 2048
  n_steps: 12000
  dt: 0.00035
  record_every: 100
  iat_points: 3000
  seeds: [0, 1, 2, 3]
  n_ref: 20000
reference:
  n_ref: 20000
  seed: 321
methods: [ULA, RawCP, LSBMC]
method_cfgs:
  RawCP: {dt: 0.00035, n_theta: 8, jump_chunk: 8, tame_cap: 5.0}
  LSBMC: {dt: 0.00035, n_theta: 8, jump_chunk: 8, tame_cap: 5.0}
