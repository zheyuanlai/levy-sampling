# E5 start-at-equilibrium invariance (triple well): initialize AT the Gibbs mixture and run.
# LSC-CP must stay at equilibrium (basin_tv stays ~0); raw CP must drift off (basin_tv rises).
experiment_name: triple_well_invariance
target: triple_well
target_cfg: {eps: 0.08}
jump_banks:
  - {kind: minima_edge_graph, name: adjacent, edges: [[0, 1], [1, 2]], intensity: 1.0}
run:
  n_particles: 2048
  n_steps: 12000
  dt: 0.00035
  record_every: 100
  iat_points: 3000
  seeds: [0, 1, 2, 3]
  n_ref: 20000
  init: equilibrium
reference: {n_ref: 20000, seed: 321}
methods: [ULA, RawCP, LSBMC]
method_cfgs:
  RawCP: {dt: 0.00035, n_theta: 8, jump_chunk: 8, tame_cap: 5.0}
  LSBMC: {dt: 0.00035, n_theta: 8, jump_chunk: 8, tame_cap: 5.0}
