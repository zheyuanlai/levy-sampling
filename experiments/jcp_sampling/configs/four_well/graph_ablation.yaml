# Four-well graph ablation at beta=6: the barrier (beta*dV = 6 per axis) traps local
# samplers in their starting quadrant within the budget, so the jump-graph STRUCTURE
# controls which basins get populated. This is the clean test of the geometry thesis:
# do structured minimum-to-minimum jumps (edge / complete graph) beat a random
# matched-length control? Codex's under-scaled beta=4 run had the random control winning;
# this re-tests it at a scale where LSBMC actually equilibrates.
experiment_name: four_well_graph
target: four_well
target_cfg: {beta: 6.0}
jump_banks:
  - {kind: minima_edge_graph, intensity: 0.4, edges: [[0, 1], [0, 2], [1, 3], [2, 3]]}
  - {kind: minima_complete_graph, intensity: 0.4}
  - {kind: random_matched_length_control, seed: 7, reference: {kind: minima_complete_graph, intensity: 0.4}}
run:
  n_particles: 512
  n_steps: 15000
  dt: 0.01
  record_every: 500
  iat_points: 3000
  seeds: [0, 1, 2]
  n_ref: 4000
reference:
  n_ref: 4000
  seed: 321
methods: [ULA, MALA, BAOAB, HMC, PT, RawCP, LSBMC]
method_cfgs:
  MALA: {dt: 0.004}
  BAOAB: {dt: 0.01, friction: 2.0}
  HMC: {dt: 0.02, n_leapfrog: 5}
  PT: {dt: 0.004, n_temps: 4, beta_min_factor: 0.2, swap_interval: 5}
  RawCP: {dt: 0.01, n_theta: 6, jump_chunk: 16}
  LSBMC: {dt: 0.01, n_theta: 6, jump_chunk: 16}
