# E5 start-at-equilibrium invariance (10D transformed MB): initialize AT the grid reference.
# LSC-CP must preserve basin populations (basin_tv stays ~0); raw CP must drift to ~0.18.
experiment_name: muller10d_invariance
target: muller10d
target_cfg: {eps: 0.5, dim: 10, sigma_aux: 0.75, scale: 0.02, grid_n: 150}
jump_banks:
  - {kind: minima_complete_graph, intensity: 1.0}
run:
  n_particles: 2048
  n_steps: 1500
  dt: 0.0028
  record_every: 20
  iat_points: 1500
  seeds: [0, 1, 2, 3]
  n_ref: 20000
  init: equilibrium
reference: {n_ref: 20000, seed: 321}
methods: [ULA, RawCP, LSBMC]
method_cfgs:
  RawCP: {dt: 0.0028, n_theta: 8, jump_chunk: 8, tame_cap: 5.0}
  LSBMC: {dt: 0.0028, n_theta: 8, jump_chunk: 8, tame_cap: 5.0}
