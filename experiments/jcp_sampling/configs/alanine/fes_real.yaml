# Experiment B: REAL alanine dipeptide on an actual force field (AMBER ff14SB + GB implicit, 300 K).
# LSC-CP samples the (phi, psi) torus with the REAL MD-derived free energy F(phi,psi) as the
# potential (AlanineFES2D, Fourier interpolant) -- NOT the analytic wrapped-Gaussian surrogate.
# Build the FES cache first with scripts/ingest_alanine_fes.py (from your trajectory or grid):
#   python -m experiments.jcp_sampling.scripts.ingest_alanine_fes --traj <phipsi.npy> \
#       --temperature 300 --units kJ --out results/jcp_sampling/alanine_fes/alanine_fes.npz
# Wrapped basin-to-basin jumps are built from the REAL FES minima; the score is periodic.
# Baselines: local Langevin (ULA), MALA, PT (the honest competitor), raw CP (bias control),
# random-direction matched-length control (geometry control). Metrics: basin-TV, dF between
# conformers, FES RMSE, all-basin coverage; ESS/sec paired with basin-TV.
experiment_name: alanine_fes_real
target: alanine_fes
target_cfg: {fes_path: results/jcp_sampling/alanine_fes/alanine_fes.npz, n_modes: 12}
jump_banks:
  - {kind: minima_complete_graph, name: wrapped_real_minima_graph, intensity: 1.0, wrap: true}
  - {kind: random_matched_length_control, name: random_control, seed: 5, reference: {kind: minima_complete_graph, intensity: 1.0, wrap: true}}
run:
  n_particles: 2048
  n_steps: 5000
  dt: 0.003
  record_every: 50
  iat_points: 2500
  seeds: [0, 1, 2, 3]
  n_ref: 20000
reference: {n_ref: 20000, seed: 321}
methods: [ULA, MALA, PT, RawCP, LSBMC]
method_cfgs:
  MALA: {dt: 0.01}
  PT: {dt: 0.01, n_temps: 4, beta_min_factor: 0.25, swap_interval: 5}
  RawCP: {dt: 0.003, n_theta: 8, jump_chunk: 12, tame_cap: 5.0, score_clip: 200.0}
  LSBMC: {dt: 0.003, n_theta: 8, jump_chunk: 12, tame_cap: 5.0, score_clip: 200.0}
