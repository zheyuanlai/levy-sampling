# Reproduction of the manuscript double-well example: target fidelity (CDF-sup, density-L1)
# for local Langevin / raw CP / LSC-CP. eps=0.125 (beta=8), Delta t=0.003, T=4.8.
# Manuscript numbers to match (within seed noise): CDF-sup 0.108 (raw) -> 0.019 (LSC-CP);
# density-L1 0.457 -> 0.253. Local Langevin stays far from equilibrium (left-well init).
experiment_name: double_well_reproduction
target: double_well
target_cfg: {beta: 8.0}
jump_banks:
  - {kind: double_well_shell, scale: 1.0, intensity: 1.0}   # shell centered at |r|=2
run:
  n_particles: 2048
  n_steps: 1600
  dt: 0.003
  record_every: 20
  iat_points: 1600
  seeds: [0, 1, 2, 3]
  n_ref: 20000
reference:
  n_ref: 20000
  seed: 321
methods: [ULA, RawCP, LSBMC]
method_cfgs:
  RawCP: {dt: 0.003, n_theta: 8, jump_chunk: 8, tame_cap: 5.0}
  LSBMC: {dt: 0.003, n_theta: 8, jump_chunk: 8, tame_cap: 5.0}
