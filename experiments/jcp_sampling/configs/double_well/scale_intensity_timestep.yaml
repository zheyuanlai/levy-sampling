experiment_name: double_well_scale
target: double_well
target_cfg: {beta: 8.0}
jump_banks:
  - {kind: double_well_shell, scale: 0.75, intensity: 0.3}
  - {kind: double_well_shell, scale: 1.0, intensity: 0.3}
  - {kind: double_well_shell, scale: 1.25, intensity: 0.3}
run:
  n_particles: 512
  n_steps: 15000
  dt: 0.01
  record_every: 500
  iat_points: 3000
  seeds: [0, 1, 2]
  n_ref: 4000
reference:
  n_ref: 4000
  seed: 321
methods: [ULA, MALA, BAOAB, HMC, PT, LSBMC]
method_cfgs:
  MALA: {dt: 0.005}
  BAOAB: {dt: 0.01, friction: 2.0}
  HMC: {dt: 0.02, n_leapfrog: 5}
  PT: {dt: 0.005, n_temps: 4, beta_min_factor: 0.2, swap_interval: 5}
  LSBMC: {dt: 0.01, n_theta: 6, jump_chunk: 16}
