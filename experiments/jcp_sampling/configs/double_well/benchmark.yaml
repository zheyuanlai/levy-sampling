# E6 efficiency benchmark (double well): full baseline suite + raw CP + LSC-CP, off-equilibrium
# (left-well) init. Report ESS/sec and ESS/grad ALONGSIDE target bias (CDF-sup) -- ESS of a
# non-converged sampler is ESS on the wrong distribution. eps=0.125.
experiment_name: double_well_benchmark
target: double_well
target_cfg: {beta: 8.0}
jump_banks:
  - {kind: double_well_shell, scale: 1.0, intensity: 1.0}
run:
  n_particles: 2048
  n_steps: 1600
  dt: 0.003
  record_every: 20
  iat_points: 1600
  seeds: [0, 1, 2, 3]
  n_ref: 20000
reference: {n_ref: 20000, seed: 321}
methods: [ULA, MALA, BAOAB, HMC, PT, RawCP, LSBMC]
method_cfgs:
  MALA: {dt: 0.004}
  BAOAB: {dt: 0.006, friction: 2.0}
  HMC: {dt: 0.02, n_leapfrog: 5}
  PT: {dt: 0.004, n_temps: 4, beta_min_factor: 0.2, swap_interval: 5}
  RawCP: {dt: 0.003, n_theta: 8, jump_chunk: 8, tame_cap: 5.0}
  LSBMC: {dt: 0.003, n_theta: 8, jump_chunk: 8, tame_cap: 5.0}
