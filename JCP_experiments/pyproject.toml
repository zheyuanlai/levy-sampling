[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jcp-levy-sampling-release"
version = "0.1.0"
description = "Reproducibility code for the E1--E4 LSC-CP JCP experiments"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.15",
  "matplotlib>=3.9",
  "torch>=2.6",
  "PyYAML>=6.0",
  "nbformat>=5.10",
  "nbclient>=0.10",
]

[project.optional-dependencies]
dev = [
  "jupyterlab>=4.2",
  "ipykernel>=6.29",
  "pytest>=8.3",
]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_cpu"]
addopts = "-ra"
