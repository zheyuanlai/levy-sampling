schema_version: 2
id: E4
slug: coupled_quartic_chain
display_name: "E4: one-dimensional two-component coupled quartic chain (24D)"
target:
  builder: src.targets.build_e4_target
  dimension: 24
  beta: 8.0
  potential: coupled_quartic_chain
  # Periodic chain of N_s = 12 sites q_i in R^2:
  #   V(q) = kappa/(2 delta) sum_i ||q_{i+1}-q_i||^2 + delta sum_i W(q_i),
  #   W(v) = (vx^2-1)^2 + (vy^2-1)^2 + c_xy vx vy + h_x vx + h_y vy,
  #   delta = 1/N_s.
  # This is a two-component coupled quartic chain, not a scalar phi^4 model.
  n_sites: 12
  kappa: 2.5
  site_coefficients:
    cxy: -0.0125
    hx: 0.0075
    hy: 0.015

order_parameter:
  # Two-component magnetization m = (1/N_s) sum_i q_i.
  kind: mean_site_vector
  components: [mx, my]

jump_law:
  kind: shell_phase_edges
  # 8 edge atoms of the phase square; the two diagonal pairs are dropped because
  # their coherent chords cross the field-zero hilltop at the centre.
  drop_diagonals: true
  weights_uniform: true
  h_rule: 0.1_times_min_atom_norm
  intensity: 1.0
  # The jump displacement carries no extra Gaussian jitter. That option is gone
  # from the configuration rather than defaulted to zero: it was only ever
  # half-supported, because the deterministic LSC quadrature has no matching
  # rule for a jittered law. Any unrecognised key here is now an error, so a
  # stale config cannot reintroduce it silently.

boundary:
  kind: rect_from_laplace_envelope
  rule: reject
  tail_probability: 1.0e-8

initial_condition:
  kind: gaussian_blob_at_phase
  phase: "--"
  sigma: 0.05

protocol:
  # REDUCED SCALE. Particles, seeds and final_time are all cut below the
  # full production values so the whole campaign completes. This is the
  # explicit temporary edit to the single default configuration that
  # AGENTS.md allows -- it is deliberately NOT a second smoke/dev profile,
  # and there is still exactly one configuration per experiment. Seeds
  # stay at 4 so seed-level uncertainty remains estimable; going lower
  # would leave the error bands meaningless.
  particles: 400
  seeds: 4
  final_time: 25.0
  initial_dt: 0.002

taming:
  default_cap: 1.0
  cp_cap_rule: two_h
  cp_cap: null

score:
  # q_theta 32, not 16: the theta rule is not converged at 16. On E1 the
  # independent dense-theta reference (shell_score_dense_theta, 200,001-node
  # Simpson) agrees with 32 and 64 to seven digits and differs from 16 by 33%,
  # and the frozen self-convergence gate rejects 16 on E1-E3. Doubling q_rho
  # moves nothing, so the radial rule was already resolved. This doubles the
  # LSC score potential-evaluation cost, which the FEE axes report honestly.
  q_theta: 32
  q_rho: 8
  m_max: 600.0
  # The chain admits an exact moment-based V(x - r) - V(x) for homogeneous
  # shifts. Its measured cost enters FEE through a calibrated equivalent, never
  # as a pretend count of generic V() calls.
  structured_fast_path: true

checkpoints:
  dense:
    count: 60
    fraction: 0.05
  sparse:
    count: 160
  include_initial: true
  include_terminal: true

plot_snapshots:
  time_values: [1.0, 5.0, 12.5, 25.0]
  max_points_per_seed: 2000

reference:
  builder: src.references.e4.build_reference
  method: multistart_pt_mala_with_snis_crosscheck
  acceptance: configs/experiments/E4_reference_acceptance.yaml
  pt_mala:
    n_runs: 4
    init_phases: ["--", "-+", "+-", "++"]
    chains_per_run: 8
    beta_min: 0.1
    # 24, not 12: beta_min fell 1.0 -> 0.1, so the ladder now spans a factor of
    # 80. With 12 replicas adjacent betas sit at 80^(1/11) ~ 1.47 apart, which
    # depresses swap acceptance and stops the hot replica's mixing reaching the
    # cold chain -- which is why doubling burn-in at beta_min 0.1 did not beat
    # beta_min 0.25. At 24 replicas the ratio is 80^(1/23) ~ 1.20.
    n_replicas: 24
    swap_interval: 5
    dt: 0.002
    # The 2,000,000-step build failed three half-run consistency gates and the
    # PT-vs-SNIS <mx> cross-check; extending to 6,000,000 failed five, because
    # these gates are denominated in standard errors and a longer run shrinks
    # the SE faster than it removes the drift (energy per site differed by only
    # 0.3% yet missed at 2.26 SE). The magnetization drift was real, so the
    # binding problem is phase mixing, not run length: that is the second step
    # of the frozen escalation order.
    #
    # beta_min 1.0 -> 0.25 -> 0.1 so the hottest replica is genuinely above the
    # inter-phase barriers and can ferry walkers between the four phases.
    # total_steps returns to 2,000,000 in proportion with the approved
    # reduction of particles, seeds and final_time -- stated plainly: the
    # shorter run is a scale decision, NOT a way to widen the gates by
    # inflating their standard errors.
    #
    # Second mixing iteration. beta_min 0.25 cut the failures from five to two,
    # both on mx: run 0 (started in phase "--") still drifts -0.0415 -> -0.1219
    # across its halves, a 0.08 physical shift rather than an SE artifact, and
    # the PT-vs-SNIS <mx> cross-check sits marginally over its 0.01 floor. So
    # the hottest replica goes to beta_min 0.1, swaps are attempted twice as
    # often, and burn-in doubles to let run 0 leave its starting phase.
    burn_in_steps: 800000
    total_steps: 3000000
    thinning: 200
    seed_base: 20260805
  snis:
    n_runs: 4
    proposals_per_run: 500000
    seed_base: 31337
    hessian_regularization: 1.0e-6
  bootstrap:
    replicates: 2000
    seed: 90210
  fallback_annealed_smc:
    enabled: false
    n_particles: 100000
    n_temperatures: 64

metrics:
  # Main text is fixed to these five.
  primary:
    - phase_weight_JS
    - order_parameter_SW2
    - order_parameter_MMD2_biased
    - energy_per_site_MAE
    - susceptibility_relative_frobenius
  secondary:
    - order_parameter_MMD2_unbiased
    - coherence_mean_error
    - correlation_relative_L2
    - kink_density_error
    - heat_capacity_error
    - binder_cumulant_error
    - heat_capacity_per_site
    - heat_capacity_per_site_reference
    - binder_cumulant
    - binder_cumulant_reference
    - marginal_KS_mx
    - marginal_KS_my
    - marginal_KS_m_norm
    - marginal_W1_mx
    - marginal_W1_my
    - marginal_W1_m_norm
    - energy_per_site_KS
    - energy_per_site_W1
    - energy_per_site_MMD2_biased
    - energy_per_site_MMD2_unbiased
    - coherence_KS
    - coherence_W1
    - kink_density_KS
    - kink_density_W1
    - kink_zero_probability
    - kink_zero_probability_reference
    - kink_zero_probability_error
    - kink_high_tail_threshold
    - kink_high_tail_probability
    - kink_high_tail_probability_reference
    - kink_high_tail_probability_error
    - connected_correlation_relative_L2
    - phase_occupancy_profile
    - phase_count_profile
    - connected_correlation_profile
  mmd:
    kernel: rbf
    bandwidth_rule: median_heuristic_on_reference_bank
    bandwidth_reference_points: 4096
  sw2:
    n_projections: 512
    projection_seed: 777

calibration:
  # Hard stability gates. A configuration that trips one of these is not a
  # valid production setting at any timestep on the grid; the calibration
  # records the diagnosis instead of silently picking something unstable.
  stability:
    max_nonfinite_fraction: 0.0
    max_boundary_reject_fraction: 0.02
    report_score_clip_fraction: true
  dt:
    grid_rule: dyadic_halving
    max_halvings: 4
    tolerance: 0.05
  mala:
    target_acceptance: [0.4, 0.75]
  pt:
    beta_min: 1.0
    target_swap_acceptance: [0.2, 0.4]
    pilot_steps: 20000
    k_initial: 8
    k_cap: 64
